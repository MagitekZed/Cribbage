<!doctype html>
<!-- One deck on the table, so the back is one global choice made here rather
     than per card. theme.css has no rule for "red" on purpose — it is the
     :root default and the attribute simply falls through to it. Phase 6's
     settings screen swaps this with a single setAttribute.

     class="game-page" scopes layout.css's page-level rules (full-height html
     and body, the wood surround, the no-horizontal-scroll guard) to THIS page.
     Unscoped they leaked into styleguide.html and made <body> the scroll
     container there, which breaks full-page screenshots and sticky headers. -->
<html lang="en" class="game-page" data-deck-back="red">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cribbage</title>
<meta name="color-scheme" content="dark light">
<meta name="description" content="A game of cribbage against the computer.">

<!-- theme.css first: everything downstream reads its tokens.
     layout.css last: it caps the board's height in the rail and replaces its
     width in the compact band, and both rules have to beat board.css. -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>

<h1 class="visually-hidden">Cribbage</h1>
<div id="game-root"></div>

<!-- Dependency order. Nothing here is a module and nothing is deferred, so the
     order of these tags IS the dependency graph:
       cards.js      values, no dependencies
       scoring.js    needs cards.js
       engine.js     needs cards.js + scoring.js
       render-*.js   DOM builders, no dependency on the engine
       render.js     needs render-cards.js + render-board.js
       animate.js    needs render-cards.js; drives a mounted render.js view
       game.js       needs all of the above -->
<script src="js/cards.js"></script>
<script src="js/scoring.js"></script>
<script src="js/engine.js"></script>
<script src="js/render-cards.js"></script>
<script src="js/render-board.js"></script>
<script src="js/render.js"></script>
<script src="js/animate.js"></script>
<script src="js/game.js"></script>

<script>
(function () {
  'use strict';

  // The bootstrap, and nothing else. Every decision the game makes lives in
  // game.js; this file's only job is to say where the game goes and to turn a
  // handful of query parameters into options, so a specific position can be
  // reproduced from a URL without a build step or a console.
  //
  //   ?speed=0..4   animation scale. OMITTED BY DEFAULT so theme.css's
  //                 prefers-reduced-motion floor decides. 0 is instant.
  //   ?target=61    a short game.
  //   ?dealer=0|1   skip the cut for deal.
  //   ?seed=N       a deterministic shuffle, for reproducing a bug report.

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var params = new URLSearchParams(window.location.search);
  var opts = { targetScore: params.get('target') === '61' ? 61 : 121 };

  var speed = parseFloat(params.get('speed'));
  if (isFinite(speed) && speed >= 0) opts.speed = speed;

  var dealer = params.get('dealer');
  if (dealer === '0' || dealer === '1') opts.dealer = Number(dealer);

  var seed = parseInt(params.get('seed'), 10);
  if (isFinite(seed)) opts.rng = mulberry32(seed);

  // The controller is the whole public surface: newGame, skip, setSpeed,
  // destroy, plus read-only handles for the console.
  window.cribbage = Cribbage.Game.create(document.getElementById('game-root'), opts);
})();
</script>

</body>
</html>
